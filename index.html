<!DOCTYPE html>
<html data-config-lang="site.language">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" data-config-content="site.themeColor" />
  <title data-config-text="site.title"></title>
  <meta name="description" data-config-content="site.description" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" data-config-href="assets.fonts.google" />
  <link rel="stylesheet" data-config-href="assets.fonts.material" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="is-locked">

<!-- ============================================ -->
<!-- TEMPLATE TAGGING BOUNDARY MARKER: OPENING CURTAIN -->
<!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG -->
<!-- ============================================ -->
<div class="curtain" id="theatrical-curtain">
  <div class="curtain__atmosphere" aria-hidden="true">
    <img class="curtain__pendopo-glow" data-config-src="assets.ornaments.pendopo" alt="" />
    <img class="curtain__cloud curtain__cloud--left" data-config-src="assets.ornaments.cloudBack" alt="" />
    <img class="curtain__cloud curtain__cloud--right" data-config-src="assets.ornaments.cloudFront" alt="" />
  </div>
  <div class="curtain__wayang curtain__wayang--left" id="curtain-wayang-left" aria-hidden="true"><img data-config-src="assets.ornaments.wayangLeft" alt="" /></div>
  <div class="curtain__wayang curtain__wayang--right" id="curtain-wayang-right" aria-hidden="true"><img data-config-src="assets.ornaments.wayangRight" alt="" /></div>
  <div class="curtain__content" id="curtain-center-content">
    <div class="curtain__gunungan-wrap"><img class="curtain__gunungan" id="curtain-gunungan" data-config-src="assets.ornaments.gunungan" alt="" /></div>
    <span class="label-caps curtain__eyebrow" data-config-text="messages.invitationEyebrow"></span>
    <h1 class="display-hero curtain__title"><span data-config-text="couple.groom.shortName"></span> &amp; <span data-config-text="couple.bride.shortName"></span></h1>
    <p class="title-script curtain__subtitle"><span data-config-text="couple.groom.name"></span> &amp; <span data-config-text="couple.bride.name"></span></p>

    <!-- ---------------------------------------------- -->
    <!-- SUB-BOUNDARY: GUEST PILL (messages.guest*) -->
    <!-- ---------------------------------------------- -->
    <div class="guest-pill">
      <p class="label-caps guest-pill__label" data-config-text="messages.guestLabel"></p>
      <h3 class="headline-sm guest-pill__name" id="invitation-guest-name" data-config-text="messages.guestDefault"></h3>
      <p class="body-sm guest-pill__note" data-config-text="messages.guestNote"></p>
    </div>
    <!-- ---------------------------------------------- -->
    <!-- END SUB-BOUNDARY: GUEST PILL -->
    <!-- ---------------------------------------------- -->

    <button class="btn btn--gold curtain__open-btn" id="btn-open-invitation" type="button"><span data-config-text="messages.openButton"></span></button>
  </div>
</div>
<!-- ============================================ -->
<!-- END TEMPLATE TAGGING BOUNDARY MARKER: OPENING CURTAIN -->
<!-- ============================================ -->

<!-- ============================================ -->
<!-- TEMPLATE TAGGING BOUNDARY MARKER: AUDIO WIDGET -->
<!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG -->
<!-- ============================================ -->
<aside class="audio-controller" id="audio-widget" data-config-aria-label="messages.audioWidgetAria">
  <audio id="gamelan-audio" loop preload="auto">
    <source data-config-src="assets.audio.src" type="audio/mpeg" />
    <source data-config-src="assets.audio.src" type="audio/mpeg" />
  </audio>
  <button class="audio-controller__btn paused" id="audio-controller-btn" type="button" data-config-aria-label="messages.audioPlayAria" aria-pressed="false">
    <span class="audio-controller__disc"><span class="material-symbols-outlined" aria-hidden="true">music_note</span></span>
    <span class="audio-controller__text">
      <span class="label-caps" data-config-text="messages.gendingLabel"></span>
      <span class="body-sm" data-config-text="assets.audio.title"></span>
    </span>
  </button>
</aside>
<!-- ============================================ -->
<!-- END TEMPLATE TAGGING BOUNDARY MARKER: AUDIO WIDGET -->
<!-- ============================================ -->

<!-- ============================================ -->
<!-- TEMPLATE TAGGING BOUNDARY MARKER: TOAST NOTIFICATION -->
<!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG -->
<!-- ============================================ -->
<div class="toast" id="toast-notification" role="status" aria-live="polite">
  <span class="material-symbols-outlined" aria-hidden="true">check_circle</span>
  <span id="toast-message" data-config-text="messages.fallbackToast"></span>
</div>
<!-- ============================================ -->
<!-- END TEMPLATE TAGGING BOUNDARY MARKER: TOAST NOTIFICATION -->
<!-- ============================================ -->

<!-- ============================================ -->
<!-- TEMPLATE TAGGING BOUNDARY MARKER: BOTTOM NAVIGATION -->
<!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG (JS-RENDERED LIST: CONFIG.nav) -->
<!-- ============================================ -->
<nav class="bottom-nav" id="bottom-nav" data-config-aria-label="messages.navAria">
  <div class="bottom-nav__track" id="bottom-nav-track" data-config-nav></div>
  <span class="bottom-nav__edge bottom-nav__edge--left" id="bottom-nav-edge-left" aria-hidden="true"><span class="material-symbols-outlined">chevron_left</span></span>
  <span class="bottom-nav__edge bottom-nav__edge--right" id="bottom-nav-edge-right" aria-hidden="true"><span class="material-symbols-outlined">chevron_right</span></span>
</nav>
<!-- ============================================ -->
<!-- END TEMPLATE TAGGING BOUNDARY MARKER: BOTTOM NAVIGATION -->
<!-- ============================================ -->

<main class="site-main">

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: HERO SECTION -->
  <!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG -->
  <!-- ============================================ -->
  <section class="section hero" id="hero">
    <div class="hero__bg" aria-hidden="true">
      <img class="hero__pendopo" data-config-src="assets.ornaments.pendopo" alt="" />
      <img class="hero__cloud hero__cloud--left" data-config-src="assets.ornaments.cloudBack" alt="" />
      <img class="hero__cloud hero__cloud--right" data-config-src="assets.ornaments.cloudFront" alt="" />
    </div>
    <div class="hero__content">
      <img class="reveal-item delay-0 hero__crest" data-config-src="assets.ornaments.gunungan" alt="" />
      <span class="reveal-item delay-100 label-caps hero__eyebrow" data-config-text="messages.invitationEyebrow"></span>
      <h1 class="reveal-item delay-100 display-hero hero__title"><span data-config-text="couple.groom.shortName"></span> &amp; <span data-config-text="couple.bride.shortName"></span></h1>
      <p class="reveal-item delay-200 title-script hero__subtitle"><span data-config-text="couple.groom.name"></span> &amp; <span data-config-text="couple.bride.name"></span></p>
      <div class="reveal-item delay-300 date-pill"><span class="material-symbols-outlined" aria-hidden="true">calendar_today</span><span data-config-text="date.displayLabel"></span></div>
    </div>
  </section>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: HERO SECTION -->
  <!-- ============================================ -->

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: INTRO DOA SECTION -->
  <!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG -->
  <!-- ============================================ -->
  <section class="section intro-doa" id="intro-doa">
    <article class="reveal-item delay-0 doa-card">
      <img class="doa-card__corner doa-card__corner--tl" data-config-src="assets.ornaments.corner" alt="" aria-hidden="true" />
      <img class="doa-card__corner doa-card__corner--tr" data-config-src="assets.ornaments.corner" alt="" aria-hidden="true" />
      <img class="doa-card__corner doa-card__corner--bl" data-config-src="assets.ornaments.corner" alt="" aria-hidden="true" />
      <img class="doa-card__corner doa-card__corner--br" data-config-src="assets.ornaments.corner" alt="" aria-hidden="true" />
      <span class="display-hero doa-card__arabic" data-config-text="intro.arabic"></span>
      <span class="label-caps doa-card__ref" data-config-text="intro.reference"></span>
      <blockquote class="body-md doa-card__quote" data-config-text="intro.quote"></blockquote>
      <div class="doa-card__rule" aria-hidden="true"></div>
    </article>
  </section>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: INTRO DOA SECTION -->
  <!-- ============================================ -->

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: COUPLE SECTION -->
  <!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG -->
  <!-- ============================================ -->
  <section class="section couple" id="couple">
    <div class="reveal-item delay-0 section-heading">
      <span class="label-caps section-heading__eyebrow" data-config-text="couple.sectionEyebrow"></span>
      <h2 class="headline-lg section-heading__title" data-config-text="couple.sectionTitle"></h2><div class="section-heading__rule" aria-hidden="true"></div>
    </div>
    <div class="couple__grid">

      <!-- ---------------------------------------------- -->
      <!-- SUB-BOUNDARY: GROOM CARD (couple.groom.*) -->
      <!-- ---------------------------------------------- -->
      <article class="reveal-item delay-100 couple-card">
        <figure class="reveal-item reveal-photo delay-200 couple-card__photo"><img data-config-src="couple.groom.photo" data-config-alt="couple.groom.name" loading="lazy" /></figure>
        <span class="label-caps couple-card__role" data-config-text="couple.groom.role"></span>
        <h3 class="headline-md couple-card__name" data-config-text="couple.groom.name"></h3>
        <p class="body-sm couple-card__parents"><span data-config-text="couple.groom.parentRole"></span>:<br /><strong data-config-text="couple.groom.father"></strong><br />&amp; <strong data-config-text="couple.groom.mother"></strong></p>
        <a class="social-chip" data-config-href="couple.groom.instagramUrl" target="_blank" rel="noopener noreferrer"><span class="material-symbols-outlined" aria-hidden="true">link</span><span data-config-text="couple.groom.instagram"></span></a>
      </article>
      <!-- ---------------------------------------------- -->
      <!-- END SUB-BOUNDARY: GROOM CARD -->
      <!-- ---------------------------------------------- -->

      <div class="reveal-item delay-200 couple__connector" aria-hidden="true"><span class="title-script" data-config-text="couple.connector"></span></div>

      <!-- ---------------------------------------------- -->
      <!-- SUB-BOUNDARY: BRIDE CARD (couple.bride.*) -->
      <!-- ---------------------------------------------- -->
      <article class="reveal-item delay-300 couple-card">
        <figure class="reveal-item reveal-photo delay-200 couple-card__photo"><img data-config-src="couple.bride.photo" data-config-alt="couple.bride.name" loading="lazy" /></figure>
        <span class="label-caps couple-card__role" data-config-text="couple.bride.role"></span>
        <h3 class="headline-md couple-card__name" data-config-text="couple.bride.name"></h3>
        <p class="body-sm couple-card__parents"><span data-config-text="couple.bride.parentRole"></span>:<br /><strong data-config-text="couple.bride.father"></strong><br />&amp; <strong data-config-text="couple.bride.mother"></strong></p>
        <a class="social-chip" data-config-href="couple.bride.instagramUrl" target="_blank" rel="noopener noreferrer"><span class="material-symbols-outlined" aria-hidden="true">link</span><span data-config-text="couple.bride.instagram"></span></a>
      </article>
      <!-- ---------------------------------------------- -->
      <!-- END SUB-BOUNDARY: BRIDE CARD -->
      <!-- ---------------------------------------------- -->

    </div>
  </section>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: COUPLE SECTION -->
  <!-- ============================================ -->

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: EVENTS SECTION -->
  <!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG -->
  <!-- ============================================ -->
  <section class="section events" id="events">
    <div class="reveal-item delay-0 section-heading"><span class="label-caps section-heading__eyebrow" data-config-text="events.eyebrow"></span><h2 class="headline-lg section-heading__title" data-config-text="events.title"></h2><div class="section-heading__rule" aria-hidden="true"></div></div>
    <div class="events__grid">

      <!-- ---------------------------------------------- -->
      <!-- SUB-BOUNDARY: AKAD NIKAH CARD (events.akad.*) -->
      <!-- ---------------------------------------------- -->
      <article class="reveal-item delay-100 event-card" data-event="akad">
        <div class="event-card__body">
          <div class="event-card__head"><span class="event-card__icon"><span class="material-symbols-outlined" aria-hidden="true">favorite</span></span><span class="label-caps event-card__tag" data-config-text="events.akad.tag"></span></div>
          <h3 class="headline-md event-card__title" data-config-text="events.akad.title"></h3><p class="body-md event-card__desc" data-config-text="events.akad.description"></p>
          <div class="event-card__meta">
            <div class="event-card__meta-row"><span class="material-symbols-outlined" aria-hidden="true">schedule</span><div><p class="label-md" data-config-text="events.akad.time"></p><p class="body-sm" data-config-text="events.akad.date"></p></div></div>
            <div class="event-card__meta-row"><span class="material-symbols-outlined" aria-hidden="true">location_on</span><div><p class="label-md" data-config-text="events.akad.venue"></p><p class="body-sm" data-config-text="events.akad.address"></p></div></div>
          </div>
        </div>
        <div class="event-card__dresscode"><span class="label-caps" data-config-text="events.dresscodeLabel"></span><div class="event-card__dresscode-row"><div class="swatches"><span class="swatch" style="background:#3b2414"></span><span class="swatch" style="background:#111111"></span><span class="swatch swatch--gold"></span></div><span class="body-sm" data-config-text="events.akadDresscode"></span></div></div>
      </article>
      <!-- ---------------------------------------------- -->
      <!-- END SUB-BOUNDARY: AKAD NIKAH CARD -->
      <!-- ---------------------------------------------- -->

      <!-- ---------------------------------------------- -->
      <!-- SUB-BOUNDARY: RESEPSI CARD (events.resepsi.*) -->
      <!-- ---------------------------------------------- -->
      <article class="reveal-item delay-200 event-card" data-event="resepsi">
        <div class="event-card__body">
          <div class="event-card__head"><span class="event-card__icon"><span class="material-symbols-outlined" aria-hidden="true">celebration</span></span><span class="label-caps event-card__tag" data-config-text="events.resepsi.tag"></span></div>
          <h3 class="headline-md event-card__title" data-config-text="events.resepsi.title"></h3><p class="body-md event-card__desc" data-config-text="events.resepsi.description"></p>
          <div class="event-card__meta">
            <div class="event-card__meta-row"><span class="material-symbols-outlined" aria-hidden="true">schedule</span><div><p class="label-md" data-config-text="events.resepsi.time"></p><p class="body-sm" data-config-text="events.resepsi.date"></p></div></div>
            <div class="event-card__meta-row"><span class="material-symbols-outlined" aria-hidden="true">location_on</span><div><p class="label-md" data-config-text="events.resepsi.venue"></p><p class="body-sm" data-config-text="events.resepsi.address"></p></div></div>
          </div>
        </div>
        <div class="event-card__dresscode"><span class="label-caps" data-config-text="events.dresscodeLabel"></span><div class="event-card__dresscode-row"><div class="swatches"><span class="swatch" style="background:#1e130c"></span><span class="swatch" style="background:#C49A45"></span><span class="swatch" style="background:#fbf7f2"></span></div><span class="body-sm" data-config-text="events.resepsiDresscode"></span></div></div>
      </article>
      <!-- ---------------------------------------------- -->
      <!-- END SUB-BOUNDARY: RESEPSI CARD -->
      <!-- ---------------------------------------------- -->

    </div>
    <br /><br />
    <button class="reveal-item delay-300 btn btn--gold" id="btn-add-calendar" type="button"><span class="material-symbols-outlined" aria-hidden="true">calendar_today</span><span data-config-text="events.saveCalendar"></span></button>
  </section>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: EVENTS SECTION -->
  <!-- ============================================ -->

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: LOCATION SECTION -->
  <!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG -->
  <!-- ============================================ -->
  <section class="section location" id="location">
    <div class="reveal-item delay-0 section-heading"><span class="label-caps section-heading__eyebrow" data-config-text="location.eyebrow"></span><h2 class="headline-lg section-heading__title" data-config-text="location.title"></h2><div class="section-heading__rule" aria-hidden="true"></div></div>
    <div class="location__grid">

      <!-- ---------------------------------------------- -->
      <!-- SUB-BOUNDARY: MAP CARD (location.mapEmbedUrl, location.directionsUrl) -->
      <!-- ---------------------------------------------- -->
      <article class="reveal-item delay-100 map-card">
        <div class="map-card__frame"><iframe class="map-card__embed" id="map-route-embed" data-config-src="location.mapEmbedUrl" data-config-title="location.mapTitle" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
        <div class="map-card__footer">
          <span class="map-card__footer-note"><span class="material-symbols-outlined" aria-hidden="true">location_on</span><span data-config-text="location.footerAddress"></span></span>
          <a class="map-card__external-link" data-config-href="location.directionsUrl" target="_blank" rel="noopener noreferrer" data-config-text="location.directionsLabel"></a>
        </div>
      </article>
      <!-- ---------------------------------------------- -->
      <!-- END SUB-BOUNDARY: MAP CARD -->
      <!-- ---------------------------------------------- -->

      <!-- ---------------------------------------------- -->
      <!-- SUB-BOUNDARY: GUEST RULES CARD (location.rules[], JS-RENDERED LIST) -->
      <!-- ---------------------------------------------- -->
      <aside class="reveal-item delay-200 rules-card">
        <div>
          <h3 class="headline-sm rules-card__title"><span class="material-symbols-outlined" aria-hidden="true">verified_user</span><span data-config-text="location.rulesTitle"></span></h3>
          <ul class="rules-card__list body-sm" data-config-list="location.rules"></ul>
        </div>
        <div class="rules-card__contact"><span class="label-caps" data-config-text="location.contactLabel"></span><p class="body-sm" data-config-text="location.contact"></p></div>
      </aside>
      <!-- ---------------------------------------------- -->
      <!-- END SUB-BOUNDARY: GUEST RULES CARD -->
      <!-- ---------------------------------------------- -->

    </div>
  </section>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: LOCATION SECTION -->
  <!-- ============================================ -->

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: LIVE STREAMING SECTION -->
  <!-- Kartu ajakan nonton live streaming. CSS: style.css § SECTION: LIVE STREAMING -->
  <!-- ============================================ -->
  <section class="section streaming" id="streaming">
    <div class="reveal-item delay-0 streaming__card">
      <div class="streaming__info">
        <span class="streaming__icon">
          <span class="material-symbols-outlined" aria-hidden="true">videocam</span>
        </span>
        <div>
          <span class="label-caps" data-config-text="streaming.eyebrow"></span>
          <h3 class="headline-sm" data-config-text="streaming.title"></h3>
          <p class="body-sm" data-config-text="streaming.description"></p>
        </div>
      </div>
      <a class="btn btn--gold-solid" data-config-href="streaming.url" target="_blank" rel="noopener noreferrer">
        <span class="material-symbols-outlined" aria-hidden="true">smart_display</span>
        <span data-config-text="streaming.buttonLabel"></span>
      </a>
    </div>
  </section>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: LIVE STREAMING SECTION -->
  <!-- ============================================ -->

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: STORY TIMELINE SECTION -->
  <!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG (JS-RENDERED LIST: CONFIG.story.items) -->
  <!-- ============================================ -->
  <section class="section story" id="story">
    <div class="reveal-item delay-0 section-heading"><span class="label-caps section-heading__eyebrow" data-config-text="story.eyebrow"></span><h2 class="headline-lg section-heading__title" data-config-text="story.title"></h2><div class="section-heading__rule" aria-hidden="true"></div></div>
    <!-- Setiap <li> timeline (ikon, tanggal, judul, deskripsi, foto) di-generate oleh hydrateConfig() di script.js dari CONFIG.story.items -->
    <ol class="story__timeline" data-config-aria-label="story.timelineAria" data-config-story></ol>
  </section>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: STORY TIMELINE SECTION -->
  <!-- ============================================ -->

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: GALLERY SECTION -->
  <!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG (JS-RENDERED LIST: CONFIG.gallery.images) -->
  <!-- ============================================ -->
  <section class="section gallery" id="gallery">
    <div class="reveal-item delay-0 section-heading"><span class="label-caps section-heading__eyebrow" data-config-text="gallery.eyebrow"></span><h2 class="headline-lg section-heading__title" data-config-text="gallery.title"></h2><div class="section-heading__rule" aria-hidden="true"></div></div>
    <div class="reveal-item delay-100 gallery-slider" id="gallery-slider" tabindex="0" role="region" aria-roledescription="carousel" data-config-aria-label="gallery.ariaLabel">
      <!-- Setiap slide (foto + caption) di-generate oleh hydrateConfig() di script.js dari CONFIG.gallery.images -->
      <div class="gallery-slider__track" id="gallery-slider-track" data-config-gallery></div>
      <button class="gallery-slider__nav gallery-slider__nav--prev" id="gallery-prev" type="button" data-config-aria-label="gallery.prevAria"><span class="material-symbols-outlined" aria-hidden="true">chevron_left</span></button>
      <button class="gallery-slider__nav gallery-slider__nav--next" id="gallery-next" type="button" data-config-aria-label="gallery.nextAria"><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></button>
      <p class="gallery-slider__status" id="gallery-slider-status" aria-live="polite"></p>
    </div>
    <div class="gallery-slider__dots" id="gallery-dots" role="tablist" data-config-aria-label="gallery.dotsAria"></div>
  </section>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: GALLERY SECTION -->
  <!-- ============================================ -->

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: GALLERY LIGHTBOX -->
  <!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG -->
  <!-- ============================================ -->
  <div class="lightbox" id="gallery-lightbox" role="dialog" aria-modal="true" data-config-aria-label="gallery.lightboxAria">
    <div class="lightbox__inner">
      <button class="lightbox__close" id="lightbox-close" type="button" data-config-aria-label="gallery.closeAria"><span class="material-symbols-outlined" aria-hidden="true">close</span></button>
      <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" type="button" data-config-aria-label="gallery.prevAria"><span class="material-symbols-outlined" aria-hidden="true">chevron_left</span></button>
      <img class="lightbox__img" id="lightbox-img" src="" data-config-alt="gallery.previewAlt" />
      <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" type="button" data-config-aria-label="gallery.nextAria"><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></button>
      <p class="lightbox__caption title-script" id="lightbox-caption"></p>
    </div>
  </div>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: GALLERY LIGHTBOX -->
  <!-- ============================================ -->

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: VIDEO SECTION -->
  <!-- Iframe YouTube responsif (rasio 16:9), tanpa JS khusus — kontrol
       play/pause/fullscreen bawaan player YouTube.
       CSS: style.css § COMPONENT: VIDEO WRAPPER
       GANTI VIDEO: ubah video.embedUrl di js/config.js -->
  <!-- ============================================ -->
  <section class="section video" id="video">
    <div class="reveal-item delay-0 section-heading"><span class="label-caps section-heading__eyebrow" data-config-text="video.eyebrow"></span><h2 class="headline-lg section-heading__title" data-config-text="video.title"></h2><div class="section-heading__rule" aria-hidden="true"></div></div>
    <div class="reveal-item delay-100 video-wrapper">
      <iframe
        data-config-src="video.embedUrl"
        data-config-title="video.embedTitle"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </section>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: VIDEO SECTION -->
  <!-- ============================================ -->

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: GIFT SECTION (AMPLOP DIGITAL) -->
  <!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG -->
  <!-- ============================================ -->
  <section class="section gift" id="gift" aria-labelledby="gift-title">
    <div class="reveal-item delay-0 section-heading"><span class="label-caps section-heading__eyebrow" data-config-text="gift.eyebrow"></span><h2 class="headline-lg section-heading__title" id="gift-title" data-config-text="gift.title"></h2><div class="section-heading__rule" aria-hidden="true"></div><p class="body-md section-heading__lead" data-config-text="gift.lead"></p></div>
    <div class="reveal-item delay-100 gift__panel" id="gift-panel">
      <button class="btn btn--gold gift__toggle" id="gift-toggle" type="button" aria-expanded="false" aria-controls="gift-content"><span class="material-symbols-outlined" aria-hidden="true">redeem</span><span class="gift__toggle-label" data-config-text="gift.openButton"></span><span class="material-symbols-outlined gift__toggle-chevron" aria-hidden="true">expand_more</span></button>
      <div class="gift__collapse" id="gift-content" role="region" aria-labelledby="gift-toggle"><div class="gift__collapse-inner"><div class="gift__collapse-body">

        <!-- ---------------------------------------------- -->
        <!-- SUB-BOUNDARY: BANK ACCOUNT CARDS (gift.banks[], JS-RENDERED LIST) -->
        <!-- ---------------------------------------------- -->
        <div class="gift__grid" data-config-banks></div>
        <!-- ---------------------------------------------- -->
        <!-- END SUB-BOUNDARY: BANK ACCOUNT CARDS -->
        <!-- ---------------------------------------------- -->

        <!-- ---------------------------------------------- -->
        <!-- SUB-BOUNDARY: PHYSICAL GIFT ADDRESS CARD (gift.address*) -->
        <!-- ---------------------------------------------- -->
        <article class="address-card">
          <div class="address-card__info"><span class="address-card__icon"><span class="material-symbols-outlined" aria-hidden="true">local_shipping</span></span><div><span class="label-caps" data-config-text="gift.physicalLabel"></span><p class="headline-sm" data-config-text="gift.addressTitle"></p><p class="body-sm" data-config-text="gift.address"></p></div></div>
          <button class="btn btn--outline-gold" type="button" data-config-copy-value="gift.addressCopyValue" data-config-copy-message="gift.addressCopyMessage" data-config-aria-label="gift.addressAria"><span class="material-symbols-outlined" aria-hidden="true">pin_drop</span><span class="btn__label" data-config-text="gift.copyAddressLabel"></span></button>
        </article>
        <!-- ---------------------------------------------- -->
        <!-- END SUB-BOUNDARY: PHYSICAL GIFT ADDRESS CARD -->
        <!-- ---------------------------------------------- -->

      </div></div></div>
    </div>
  </section>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: GIFT SECTION -->
  <!-- ============================================ -->

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: WISHES SECTION (BUKU TAMU) -->
  <!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG -->
  <!-- ============================================ -->
  <section class="section wishes" id="wishes">
    <div class="reveal-item delay-0 section-heading"><span class="label-caps section-heading__eyebrow" data-config-text="wishes.eyebrow"></span><h2 class="headline-lg section-heading__title" data-config-text="wishes.title"></h2><div class="section-heading__rule" aria-hidden="true"></div><p class="body-md section-heading__lead" data-config-text="wishes.lead"></p></div>
    <div class="wishes__layout" id="wishes-layout">

      <!-- ---------------------------------------------- -->
      <!-- SUB-BOUNDARY: GUESTBOOK FORM (wishes.*, POST ke guestbookApiUrl) -->
      <!-- ---------------------------------------------- -->
      <form class="reveal-item delay-100 guestbook-form wishes__form" id="guestbook-form" novalidate aria-describedby="guestbook-status">
        <div class="form-field"><label class="label-md" for="guestbook-name" data-config-text="wishes.nameLabel"></label><input class="form-input" id="guestbook-name" name="nama" type="text" maxlength="100" data-config-placeholder="wishes.namePlaceholder" required aria-required="true" /></div>
        <div class="form-field"><span class="label-md" data-config-text="wishes.attendanceLabel"></span><div class="attendance-toggle attendance-toggle--binary"><label class="attendance-toggle__option"><input type="radio" name="kehadiran" data-config-value="wishes.attending" checked required /><span data-config-text="wishes.attending"></span></label><label class="attendance-toggle__option"><input type="radio" name="kehadiran" data-config-value="wishes.notAttending" /><span data-config-text="wishes.notAttending"></span></label></div></div>
        <div class="form-field"><label class="label-md" for="guestbook-message" data-config-text="wishes.messageLabel"></label><textarea class="form-input" id="guestbook-message" name="pesan" rows="4" maxlength="1000" data-config-placeholder="wishes.messagePlaceholder" required aria-required="true"></textarea></div>
        <p class="guestbook-status" id="guestbook-status" role="status" aria-live="polite"></p>
        <button class="btn btn--gold guestbook-form__submit" id="guestbook-submit" type="submit"><span class="material-symbols-outlined guestbook-form__submit-icon" aria-hidden="true">send</span><span class="guestbook-form__submit-dots" aria-hidden="true"><span></span><span></span><span></span></span><span class="guestbook-form__submit-label" data-config-text="wishes.submit"></span></button>
      </form>
      <!-- ---------------------------------------------- -->
      <!-- END SUB-BOUNDARY: GUESTBOOK FORM -->
      <!-- ---------------------------------------------- -->

      <!-- ---------------------------------------------- -->
      <!-- SUB-BOUNDARY: WISHES LIST (fetched + JS-RENDERED: renderGuestbookEntries()) -->
      <!-- ---------------------------------------------- -->
      <div class="reveal-item delay-200 wishes__list" id="wishes-container" data-config-aria-label="wishes.listAria" aria-live="polite"><p class="wishes__empty" id="wishes-empty" data-config-text="wishes.empty"></p></div>
      <!-- ---------------------------------------------- -->
      <!-- END SUB-BOUNDARY: WISHES LIST -->
      <!-- ---------------------------------------------- -->

    </div>
  </section>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: WISHES SECTION -->
  <!-- ============================================ -->

  <!-- ============================================ -->
  <!-- TEMPLATE TAGGING BOUNDARY MARKER: CLOSING FOOTER -->
  <!-- AREA INI MENGGUNAKAN DYNAMIC INJECTION CONFIG -->
  <!-- ============================================ -->
  <footer class="section closing" id="closing">
    <div class="closing__bg" aria-hidden="true"><img data-config-src="assets.ornaments.gunungan" alt="" /></div>
    <div class="closing__content">
      <img class="reveal-item delay-0 closing__emblem" data-config-src="assets.ornaments.gunungan" alt="" />
      <h3 class="reveal-item delay-100 title-script closing__title" data-config-text="closing.title"></h3>
      <p class="reveal-item delay-100 body-md closing__lead" data-config-text="closing.lead"></p>
      <p class="reveal-item delay-200 headline-sm closing__salam" data-config-text="closing.salam"></p>
      <span class="reveal-item delay-200 display-hero closing__dua" data-config-text="closing.dua"></span>

      <!-- ---------------------------------------------- -->
      <!-- SUB-BOUNDARY: FAMILIES BLOCK (couple.groom.*, couple.bride.*) -->
      <!-- ---------------------------------------------- -->
      <div class="reveal-item delay-300 closing__families">
        <div class="closing__family"><span class="label-caps" data-config-text="closing.groomFamilyLabel"></span><p class="headline-sm" data-config-text="couple.groom.father"></p><p class="body-sm">&amp; <span data-config-text="couple.groom.mother"></span></p></div>
        <span class="closing__heart"><span class="material-symbols-outlined" aria-hidden="true">favorite</span></span>
        <div class="closing__family"><span class="label-caps" data-config-text="closing.brideFamilyLabel"></span><p class="headline-sm" data-config-text="couple.bride.father"></p><p class="body-sm">&amp; <span data-config-text="couple.bride.mother"></span></p></div>
      </div>
      <!-- ---------------------------------------------- -->
      <!-- END SUB-BOUNDARY: FAMILIES BLOCK -->
      <!-- ---------------------------------------------- -->

      <div class="reveal-item delay-300 closing__signature"><p class="display-hero"><span data-config-text="couple.groom.shortName"></span> &amp; <span data-config-text="couple.bride.shortName"></span></p><p class="label-caps"><span data-config-text="date.locationLabel"></span> &bull; <span data-config-text="date.year"></span></p></div>
    </div>
  </footer>
  <!-- ============================================ -->
  <!-- END TEMPLATE TAGGING BOUNDARY MARKER: CLOSING FOOTER -->
  <!-- ============================================ -->

</main>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
